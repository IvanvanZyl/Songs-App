name: Build Android APK
on:
  push: { branches: [ main, master ] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LW-Songs.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LW-Songs-APK
          path: LW-Songs.apk
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest LW-Songs.apk -t "LW Songs — install file" -n "Tap **LW-Songs.apk** below to install on Android (allow installing from unknown sources)."
